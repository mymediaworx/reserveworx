# One-shot document-root diagnosis. Stays off main. Does not deploy or print secrets.
name: Diagnose once

on:
  push:
    branches:
      - cursor/production-install-681b
    paths:
      - .github/workflows/diagnose-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose document root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Mask connection secrets
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -n "${SG_HOST}" ]; then echo "::add-mask::${SG_HOST}"; fi
          if [ -n "${SG_USER}" ]; then echo "::add-mask::${SG_USER}"; fi
          if [ -n "${SG_PORT}" ]; then echo "::add-mask::${SG_PORT}"; fi
          if [ -n "${SG_SSH_PASSPHRASE}" ]; then echo "::add-mask::${SG_SSH_PASSPHRASE}"; fi

      - name: Inspect the document root
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          chmod +x scripts/ssh-siteground.sh scripts/prepare-siteground-ssh.sh scripts/diagnose-docroot.sh
          scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" bash -s < scripts/diagnose-docroot.sh
