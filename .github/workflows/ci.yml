name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Nightly full run on both databases (07:17 UTC, about 3am Eastern).
  # Deploy ignores CI runs that are not a push to main.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run still going. Each run
# on main gets its own group, so none is cancelled or left pending: Deploy
# waits for them.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: vendor/bin/pint --test

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: vendor/bin/phpstan analyse --no-progress

  audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer audit

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse edits to the Unreleased section
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="${BASE_SHA}"
          else
            base="${BEFORE_SHA}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No base commit to compare. Skipping."
            exit 0
          fi
          git show "${base}:docs/CHANGELOG.md" > /tmp/changelog-base.md
          bash .github/scripts/check-changelog-unreleased.sh /tmp/changelog-base.md docs/CHANGELOG.md

  # Production runs MySQL 8.4 (docs/HOSTING.md), so every run tests on MySQL,
  # including the concurrency suite. MariaDB 11.8 stays supported (Spec
  # Section 2) and runs nightly, on manual runs, on changes that touch money,
  # booking, allocation, tenancy, models, migrations or dependencies, and on
  # pull requests labelled full-ci. Approved by Michael on October 29, 2026.
  scope:
    name: Test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - name: Decide which databases to test
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          mysql='{"name":"MySQL 8.4","image":"mysql:8.4","health":"mysqladmin ping -h 127.0.0.1 -ureserveworx -preserveworx"}'
          mariadb='{"name":"MariaDB 11.8","image":"mariadb:11.8","health":"healthcheck.sh --connect --innodb_initialized"}'
          critical='^(app/Domain/(Fees|Payments|Pricing)/|app/Services/(Allocation|Booking|Inventory|Payments|Pricing|Schedule|Scheduling|Tenancy|Webhooks)/|app/Tenancy/|app/Models/|database/migrations/|config/(database|services)\.php$|tests/Feature/(Allocation|Booking|Inventory|Payments|Tenancy|Webhooks)/|tests/Unit/Domain/|composer\.(json|lock)$|phpunit\.xml$|\.github/workflows/ci\.yml$)'
          full=false
          reason="no money, booking, allocation, tenancy or migration files changed"
          files=""
          if [[ "$EVENT" == "schedule" || "$EVENT" == "workflow_dispatch" ]]; then
            full=true; reason="${EVENT} run"
          elif [[ "$EVENT" == "pull_request" ]]; then
            if echo "$PR_LABELS" | grep -q '"full-ci"'; then
              full=true; reason="labelled full-ci"
            elif ! files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"; then
              full=true; reason="could not list changed files"
            fi
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            full=true; reason="no base commit to compare"
          elif ! files="$(gh api "repos/${REPO}/compare/${BEFORE}...${AFTER}" --jq '.files[].filename')"; then
            full=true; reason="could not compare commits"
          fi
          if [[ "$full" == "false" && -n "$files" ]] && hits="$(printf '%s\n' "$files" | grep -E "$critical")"; then
            full=true; reason="critical paths changed: $(printf '%s' "$hits" | head -5 | tr '\n' ' ')"
          fi
          if [[ "$full" == "true" ]]; then
            matrix="{\"include\":[${mysql},${mariadb}]}"
          else
            matrix="{\"include\":[${mysql}]}"
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          {
            echo "## Test scope"
            echo
            echo "- MariaDB leg: ${full}"
            echo "- Reason: ${reason}"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests (${{ matrix.name }})
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: reserveworx_test
          MYSQL_USER: reserveworx
          MYSQL_PASSWORD: reserveworx
          MYSQL_ROOT_PASSWORD: reserveworx
          MARIADB_DATABASE: reserveworx_test
          MARIADB_USER: reserveworx
          MARIADB_PASSWORD: reserveworx
          MARIADB_ROOT_PASSWORD: reserveworx
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, curl, zip, bcmath, intl, pdo_mysql
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: reserveworx_test
          DB_USERNAME: reserveworx
          DB_PASSWORD: reserveworx
        run: php artisan test
