# Deploys are stopped. This file stays off main. Running it does not deploy
# and does not confirm a backup.
name: Deploy main once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stopped:
    name: Deploy is stopped
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "Deploys are stopped until Michael says otherwise."
          exit 1
