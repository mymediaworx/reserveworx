name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy the current main commit, or roll back to the previous release
        type: choice
        required: true
        options:
          - deploy
          - rollback
        default: deploy
      run_migrations:
        description: Run php artisan migrate --force after deploy
        type: boolean
        required: true
        default: false
      migration_confirmation:
        description: 'Required only when migrations are enabled. Type exactly: I have a backup'
        type: string
        required: false
        default: ""

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Mask connection secrets
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -n "${SG_HOST}" ]; then echo "::add-mask::${SG_HOST}"; fi
          if [ -n "${SG_USER}" ]; then echo "::add-mask::${SG_USER}"; fi
          if [ -n "${SG_PORT}" ]; then echo "::add-mask::${SG_PORT}"; fi
          if [ -n "${SG_SSH_PASSPHRASE}" ]; then echo "::add-mask::${SG_SSH_PASSPHRASE}"; fi

      - name: Resolve release
        id: release
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy"
            echo
            echo "- Action: ${{ inputs.action }}"
            echo "- Commit: ${sha}"
            echo "- Migrations requested: ${{ inputs.run_migrations }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: shivammathur/setup-php@v2
        if: inputs.action == 'deploy'
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        if: inputs.action == 'deploy'
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install rsync
        if: inputs.action == 'deploy'
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Upload release
        if: inputs.action == 'deploy'
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          RELEASE: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/ssh-siteground.sh scripts/prepare-siteground-ssh.sh
          if [[ ! "$RELEASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to upload because the release id is not a commit sha." >&2
            exit 1
          fi
          scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" "mkdir -p reserveworx/releases/${RELEASE} reserveworx/shared/storage"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude 'storage/logs/' \
            --exclude 'storage/framework/cache/' \
            --exclude 'storage/framework/sessions/' \
            --exclude 'storage/framework/views/' \
            --exclude 'storage/pail/' \
            -e "scripts/ssh-siteground.sh" \
            ./ "${SG_USER}@${SG_HOST}:reserveworx/releases/${RELEASE}/"

      - name: Activate release
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          ACTION: ${{ inputs.action }}
          RELEASE: ${{ steps.release.outputs.sha }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
        run: |
          set -euo pipefail
          chmod +x scripts/ssh-siteground.sh scripts/prepare-siteground-ssh.sh
          remote_cmd="$(printf 'ACTION=%q RELEASE=%q RUN_MIGRATIONS=%q MIGRATION_CONFIRMATION=%q bash -s' \
            "$ACTION" "$RELEASE" "$RUN_MIGRATIONS" "$MIGRATION_CONFIRMATION")"
          {
            echo
            echo '```'
            scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" "$remote_cmd" < scripts/remote-deploy.sh
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
