name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy the current main commit, or roll back to the previous release
        type: choice
        required: true
        options:
          - deploy
          - rollback
        default: deploy
      run_migrations:
        description: Run php artisan migrate --force after a verified database dump. The job fails when that dump is missing, empty, or fails gunzip -t.
        type: boolean
        required: true
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Mask connection secrets
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -n "${SG_HOST}" ]; then echo "::add-mask::${SG_HOST}"; fi
          if [ -n "${SG_USER}" ]; then echo "::add-mask::${SG_USER}"; fi
          if [ -n "${SG_PORT}" ]; then echo "::add-mask::${SG_PORT}"; fi
          if [ -n "${SG_SSH_PASSPHRASE}" ]; then echo "::add-mask::${SG_SSH_PASSPHRASE}"; fi

      - name: Resolve release
        id: release
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy"
            echo
            echo "- Action: ${{ inputs.action }}"
            echo "- Commit: ${sha}"
            echo "- Migrations requested: ${{ inputs.run_migrations }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: shivammathur/setup-php@v2
        if: inputs.action == 'deploy'
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        if: inputs.action == 'deploy'
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Pack one release archive
        if: inputs.action == 'deploy'
        env:
          RELEASE: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to pack because the release id is not a commit sha." >&2
            exit 1
          fi
          tar -czf "/tmp/reserveworx-${RELEASE}.tar.gz" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'storage/logs' \
            --exclude 'storage/framework/cache/data' \
            --exclude 'storage/framework/sessions' \
            --exclude 'storage/framework/views' \
            --exclude 'storage/pail' \
            .

      - name: Back up the application database
        id: dbbackup
        if: inputs.action == 'deploy' && inputs.run_migrations == true
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          chmod +x scripts/ssh-siteground.sh scripts/prepare-siteground-ssh.sh
          remote_cmd="$(printf 'ACTION=%q bash -s' backup)"
          scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" "$remote_cmd" < scripts/remote-deploy.sh | tee /tmp/backup-out.txt
          path="$(sed -n 's/^backup_path=//p' /tmp/backup-out.txt | tail -n 1)"
          bytes="$(sed -n 's/^backup_bytes=//p' /tmp/backup-out.txt | tail -n 1)"
          gunzip_ok="$(sed -n 's/^gunzip_test=//p' /tmp/backup-out.txt | tail -n 1)"
          if [[ -z "$path" || "$gunzip_ok" != "ok" || ! "$bytes" =~ ^[0-9]+$ || "$bytes" -lt 1 ]]; then
            echo "Database dump was not verified. Migrations will not run." >&2
            exit 1
          fi
          case "$path" in
            */www/app.reserveworx.com/laravel/shared/backups/*.sql.gz) ;;
            *)
              echo "Database dump path was rejected." >&2
              exit 1
              ;;
          esac
          case "$path" in
            *public_html*|*www/reserveworx.com/*)
              echo "Database dump path was rejected." >&2
              exit 1
              ;;
          esac
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"

      - name: Upload release archive
        if: inputs.action == 'deploy'
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          RELEASE: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/ssh-siteground.sh scripts/prepare-siteground-ssh.sh
          scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" "test -d www/app.reserveworx.com && mkdir -p www/app.reserveworx.com/laravel/incoming"
          scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" "cat > www/app.reserveworx.com/laravel/incoming/${RELEASE}.tar.gz" < "/tmp/reserveworx-${RELEASE}.tar.gz"
          rm -f "/tmp/reserveworx-${RELEASE}.tar.gz"

      - name: Activate release
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          ACTION: ${{ inputs.action }}
          RELEASE: ${{ steps.release.outputs.sha }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          BACKUP_PATH: ${{ steps.dbbackup.outputs.path }}
        run: |
          set -euo pipefail
          chmod +x scripts/ssh-siteground.sh scripts/prepare-siteground-ssh.sh
          remote_cmd="$(printf 'ACTION=%q RELEASE=%q RUN_MIGRATIONS=%q BACKUP_PATH=%q bash -s' \
            "$ACTION" "$RELEASE" "$RUN_MIGRATIONS" "$BACKUP_PATH")"
          {
            echo
            echo '```'
            scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" "$remote_cmd" < scripts/remote-deploy.sh
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
