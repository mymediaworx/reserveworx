# One-shot read-only SiteGround report. This file stays off main.
# Pushing it is the trigger because this GitHub App cannot call workflow_dispatch.
# The log records only secret shape (empty / short / private key), never values.
name: Hosting check once

on:
  push:
    branches:
      - cursor/hosting-facts-681b
    paths:
      - .github/workflows/hosting-check-once.yml

permissions:
  contents: read

jobs:
  report:
    name: SiteGround hosting report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Mask connection secrets
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -n "${SG_HOST}" ]; then echo "::add-mask::${SG_HOST}"; fi
          if [ -n "${SG_USER}" ]; then echo "::add-mask::${SG_USER}"; fi
          if [ -n "${SG_PORT}" ]; then echo "::add-mask::${SG_PORT}"; fi
          if [ -n "${SG_SSH_PASSPHRASE}" ]; then echo "::add-mask::${SG_SSH_PASSPHRASE}"; fi

      - name: Collect hosting report
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          PROBE_SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          PROBE_SG_SSH_PRIVATE_KEY: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          PROBE_SG_PRIVATE_KEY: ${{ secrets.SG_PRIVATE_KEY }}
          PROBE_SG_KEY: ${{ secrets.SG_KEY }}
          PROBE_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PROBE_SITEGROUND_SSH_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          PROBE_SG_DEPLOY_KEY: ${{ secrets.SG_DEPLOY_KEY }}
          PROBE_DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          PROBE_SSH_KEY: ${{ secrets.SSH_KEY }}
          PROBE_SG_ID_RSA: ${{ secrets.SG_ID_RSA }}
          PROBE_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PROBE_SG_SSH_KEY_B64: ${{ secrets.SG_SSH_KEY_B64 }}
          PROBE_SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          chmod +x scripts/ssh-siteground.sh scripts/prepare-siteground-ssh.sh
          python3 - << 'PY'
          import base64, os
          names = [
              "PROBE_SG_SSH_KEY",
              "PROBE_SG_SSH_PRIVATE_KEY",
              "PROBE_SG_PRIVATE_KEY",
              "PROBE_SG_KEY",
              "PROBE_SSH_PRIVATE_KEY",
              "PROBE_SITEGROUND_SSH_KEY",
              "PROBE_SG_DEPLOY_KEY",
              "PROBE_DEPLOY_KEY",
              "PROBE_SSH_KEY",
              "PROBE_SG_ID_RSA",
              "PROBE_PRIVATE_KEY",
              "PROBE_SG_SSH_KEY_B64",
              "PROBE_SG_SSH_PASSPHRASE",
          ]
          def shape(val: str) -> str:
              if val == "":
                  return "empty"
              stripped = val.strip()
              decoded = b""
              try:
                  decoded = base64.b64decode(stripped, validate=True)
              except Exception:
                  decoded = b""
              keyish = (
                  "PRIVATE KEY" in val[:400]
                  or stripped.startswith("-----BEGIN")
                  or b"PRIVATE KEY" in decoded[:400]
              )
              if keyish and b"PRIVATE KEY" in decoded[:400] and "PRIVATE KEY" not in val[:400]:
                  kind = "base64_private_key"
              elif keyish:
                  kind = "private_key"
              elif len(val) >= 200:
                  kind = "long"
              else:
                  kind = "short"
              return f"{kind} lines={val.count(chr(10))} bytes={len(val.encode())}"
          chosen = ""
          for name in names:
              val = os.environ.get(name, "")
              info = shape(val)
              print(f"{name} {info}")
              if chosen == "" and info.startswith(("private_key", "base64_private_key")) and name != "PROBE_SG_SSH_PASSPHRASE":
                  chosen = name
          if chosen == "" and shape(os.environ.get("PROBE_SG_SSH_PASSPHRASE", "")).startswith(("private_key", "base64_private_key")):
              chosen = "PROBE_SG_SSH_PASSPHRASE"
          print(f"chosen={chosen or 'none'}")
          open("/tmp/sg-chosen", "w").write(chosen)
          PY
          chosen="$(cat /tmp/sg-chosen)"
          rm -f /tmp/sg-chosen
          if [ "$chosen" = "none" ] || [ -z "$chosen" ]; then
            echo "No private-key secret is available to this workflow. SSH was not attempted." >&2
            exit 1
          fi
          case "$chosen" in
            PROBE_SG_SSH_KEY) SG_SSH_KEY="$PROBE_SG_SSH_KEY" ;;
            PROBE_SG_SSH_PRIVATE_KEY) SG_SSH_KEY="$PROBE_SG_SSH_PRIVATE_KEY" ;;
            PROBE_SG_PRIVATE_KEY) SG_SSH_KEY="$PROBE_SG_PRIVATE_KEY" ;;
            PROBE_SG_KEY) SG_SSH_KEY="$PROBE_SG_KEY" ;;
            PROBE_SSH_PRIVATE_KEY) SG_SSH_KEY="$PROBE_SSH_PRIVATE_KEY" ;;
            PROBE_SITEGROUND_SSH_KEY) SG_SSH_KEY="$PROBE_SITEGROUND_SSH_KEY" ;;
            PROBE_SG_DEPLOY_KEY) SG_SSH_KEY="$PROBE_SG_DEPLOY_KEY" ;;
            PROBE_DEPLOY_KEY) SG_SSH_KEY="$PROBE_DEPLOY_KEY" ;;
            PROBE_SSH_KEY) SG_SSH_KEY="$PROBE_SSH_KEY" ;;
            PROBE_SG_ID_RSA) SG_SSH_KEY="$PROBE_SG_ID_RSA" ;;
            PROBE_PRIVATE_KEY) SG_SSH_KEY="$PROBE_PRIVATE_KEY" ;;
            PROBE_SG_SSH_KEY_B64) SG_SSH_KEY="$PROBE_SG_SSH_KEY_B64" ;;
            PROBE_SG_SSH_PASSPHRASE)
              SG_SSH_KEY="$PROBE_SG_SSH_PASSPHRASE"
              SG_SSH_PASSPHRASE=""
              ;;
            *)
              echo "Unrecognized key selector. SSH was not attempted." >&2
              exit 1
              ;;
          esac
          export SG_SSH_KEY SG_SSH_PASSPHRASE
          unset PROBE_SG_SSH_KEY PROBE_SG_SSH_PRIVATE_KEY PROBE_SG_PRIVATE_KEY PROBE_SG_KEY \
            PROBE_SSH_PRIVATE_KEY PROBE_SITEGROUND_SSH_KEY PROBE_SG_DEPLOY_KEY PROBE_DEPLOY_KEY \
            PROBE_SSH_KEY PROBE_SG_ID_RSA PROBE_PRIVATE_KEY PROBE_SG_SSH_KEY_B64 PROBE_SG_SSH_PASSPHRASE
          if [[ "$SG_SSH_KEY" != *"PRIVATE KEY"* && "$SG_SSH_KEY" != *"-----BEGIN"* ]]; then
            decoded="$(printf '%s' "$SG_SSH_KEY" | base64 -d 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then
              SG_SSH_KEY="$decoded"
              unset decoded
            fi
          fi
          {
            echo "## SiteGround hosting check"
            echo
            echo "Read-only report for spec Section 2.2. Secrets are not printed."
            echo "key_secret=${chosen}"
            echo
            echo '```'
            scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" bash -s < scripts/hosting-check-remote.sh
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
