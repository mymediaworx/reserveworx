# One-shot first install. This file stays off main.
# A push of this file is the trigger because this GitHub App cannot dispatch workflows.
# Retries after the document root listing stopped using /dev/fd.
name: First install once

on:
  push:
    branches:
      - cursor/production-install-681b
    paths:
      - .github/workflows/first-install-once.yml

permissions:
  contents: read

jobs:
  install:
    name: Install app.reserveworx.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Mask connection secrets
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          SG_DB_DATABASE: ${{ secrets.SG_DB_DATABASE }}
          SG_DB_USERNAME: ${{ secrets.SG_DB_USERNAME }}
          SG_DB_PASSWORD: ${{ secrets.SG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$SG_HOST" "$SG_USER" "$SG_PORT" "$SG_SSH_PASSPHRASE" "$SG_DB_DATABASE" "$SG_DB_USERNAME" "$SG_DB_PASSWORD"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done

      - name: Write shared env
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          RW_DB_DATABASE: ${{ secrets.SG_DB_DATABASE }}
          RW_DB_USERNAME: ${{ secrets.SG_DB_USERNAME }}
          RW_DB_PASSWORD: ${{ secrets.SG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/ssh-siteground.sh scripts/prepare-siteground-ssh.sh scripts/write-production-env.sh
          if [ -z "$RW_DB_DATABASE" ] || [ -z "$RW_DB_USERNAME" ] || [ -z "$RW_DB_PASSWORD" ]; then
            echo "A database secret is empty. shared/.env was not written." >&2
            exit 1
          fi
          app_key="base64:$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::${app_key}"
          remote_cmd="$(printf 'RW_APP_KEY=%q RW_DB_DATABASE=%q RW_DB_USERNAME=%q RW_DB_PASSWORD=%q bash -s' \
            "$app_key" "$RW_DB_DATABASE" "$RW_DB_USERNAME" "$RW_DB_PASSWORD")"
          scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" "$remote_cmd" < scripts/write-production-env.sh

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Pack one release archive
        id: release
        run: |
          set -euo pipefail
          release="$(git rev-parse HEAD)"
          if [[ ! "$release" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to pack because the release id is not a commit sha." >&2
            exit 1
          fi
          tar -czf "/tmp/reserveworx-${release}.tar.gz" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'storage/logs' \
            --exclude 'storage/framework/cache/data' \
            --exclude 'storage/framework/sessions' \
            --exclude 'storage/framework/views' \
            --exclude 'storage/pail' \
            .
          echo "sha=${release}" >> "$GITHUB_OUTPUT"

      - name: Upload release archive
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          RELEASE: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/ssh-siteground.sh scripts/prepare-siteground-ssh.sh
          scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" "test -d www/app.reserveworx.com && mkdir -p www/app.reserveworx.com/laravel/incoming"
          scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" "cat > www/app.reserveworx.com/laravel/incoming/${RELEASE}.tar.gz" < "/tmp/reserveworx-${RELEASE}.tar.gz"
          rm -f "/tmp/reserveworx-${RELEASE}.tar.gz"

      - name: Activate release and seed
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          RELEASE: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/ssh-siteground.sh scripts/prepare-siteground-ssh.sh scripts/remote-deploy.sh scripts/seed-and-verify.sh
          remote_cmd="$(printf 'ACTION=%q RELEASE=%q RUN_MIGRATIONS=%q MIGRATION_CONFIRMATION=%q bash -s' \
            deploy "$RELEASE" true "I have a backup")"
          set +e
          scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" "$remote_cmd" < scripts/remote-deploy.sh
          deploy_exit=$?
          set -e
          echo "deploy_script_exit=${deploy_exit}"
          scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" bash -s < scripts/seed-and-verify.sh
